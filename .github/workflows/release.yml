name: Create Release and Build Docker Image
on:
  push:
    tags:
      - 'v*'   # Trigger op tags zoals v1.0.0, v2.3.1 etc.

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create artifact (example)
        run: |
          mkdir output
          echo "build completed for $GITHUB_REF_NAME" > output/info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
          
  release:
      name: Create GitHub Release
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Download build artifacts
          uses: actions/download-artifact@v4
          with:
            name: build-output
            path: release/

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            body: |
              🚀 **Automatische release gebouwd met GitHub Actions**
              - Commit: ${{ github.sha }}
              - Tag: ${{ github.ref_name }}
            files: |
              release/**
