# Dedicated stack for the MCP servers (and docker-socket-proxy) backing the
# live-home-page dashboard's live Platforms Monitor tab. Meant to run on
# docker-server (192.168.50.3), not on a dev machine — the app's own
# MCP_*_URL/DOCKER_API_URL env vars point at MCP_HOST (see .env).
#
# Usage (on docker-server, from the directory holding this file and a
# `kubeconfig` file with read access to the cluster):
#   docker compose -f docker-compose.mcp.yaml up -d
#
# No MCP server credentials are committed to this repo: Home Assistant's
# token and the kubeconfig both come from the host's own .env/filesystem.
# The GitHub server holds no secret at all — the live-home-page app authenticates
# to it per-request with its own MCP_GITHUB_TOKEN. The UniFi Network server
# reads UNIFI_NETWORK_HOST/USERNAME/PASSWORD (and optional
# UNIFI_MCP_ALLOWED_HOSTS) from .env and serves Streamable HTTP at :8088/mcp.

services:
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"

  ha-mcp:
    container_name: ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    command: ha-mcp-web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "8086:8086"
    volumes:
      - ha-mcp-data:/home/mcpuser/.ha-mcp
    environment:
      - HOMEASSISTANT_URL=${HOMEASSISTANT_URL}
      - HOMEASSISTANT_TOKEN=${HOMEASSISTANT_TOKEN}
    restart: unless-stopped

  kubernetes-mcp-server:
    image: ghcr.io/containers/kubernetes-mcp-server:latest
    container_name: kubernetes-mcp-server
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      - ${KUBECONFIG_PATH:-./kubeconfig}:/kubeconfig/config:ro
    command:
      - --port=8080
      - --kubeconfig=/kubeconfig/config
      - --read-only
      - --disable-destructive
      - --stateless

  # github-mcp-server:
  #   image: ghcr.io/github/github-mcp-server:latest
  #   container_name: github-mcp-server
  #   restart: unless-stopped
  #   ports:
  #     - "8082:8082"
  #   environment:
  #     - GITHUB_TOKEN=${MCP_GITHUB_TOKEN}
  #   command:
  #     - http
  #     - --port=8082
  #     - --read-only
  #     - --toolsets=repos,context

  unifi-mcp:
    image: ghcr.io/enuno/unifi-mcp-server:latest
    environment:
      UNIFI_API_KEY: ${UNIFI_LOCAL_API_KEY}
      UNIFI_API_TYPE: local
      UNIFI_LOCAL_HOST: ${UNIFI_LOCAL_IP}
      UNIFI_LOCAL_VERIFY_SSL: false
      MCP_SERVER_TRANSPORT: http
      MCP_SERVER_PORT: 3000
      MCP_SERVER_HOST: 0.0.0.0            # container-internal; keep the published port on loopback
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}   # required — clients send Authorization: Bearer <token>
    ports:
      # Published on loopback; put an authenticating TLS proxy in front to expose it further.
      - "127.0.0.1:3000:3000"

  unifi-mcp-cloud:
    image: ghcr.io/enuno/unifi-mcp-server:latest
    environment:
      UNIFI_API_KEY: ${UNIFI_CLOUD_API_KEY}
      UNIFI_API_TYPE: cloud-v1
      MCP_SERVER_TRANSPORT: http
      MCP_SERVER_PORT: 3001
      MCP_SERVER_HOST: 0.0.0.0            # container-internal; keep the published port on loopback
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}   # required — clients send Authorization: Bearer <token>
    ports:
      # Published on loopback; put an authenticating TLS proxy in front to expose it further.
      - "127.0.0.1:3001:3001"

volumes:
  ha-mcp-data:
    name: ha-mcp-data