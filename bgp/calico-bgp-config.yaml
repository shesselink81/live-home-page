apiVersion: projectcalico.org/v3
kind: BGPConfiguration
metadata:
  name: default
spec:
  logSeverityScreen: Info
  nodeToNodeMeshEnabled: true
  asNumber: 64512
  # Advertise LoadBalancer service IPs (e.g. Traefik) to the UCG Ultra
  serviceLoadBalancerIPs:
    - cidr: 0.0.0.0/0
  # Advertise ClusterIPs if you want in-cluster services reachable from the LAN
  # serviceClusterIPs:
  #   - cidr: 10.96.0.0/12
