apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unifi-ai.fullname" . }}
  labels:
    {{- include "unifi-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "unifi-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unifi-ai.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: UNIFI_LOCAL_URL
              value: {{ include "unifi-ai.localUrl" . | quote }}
            - name: UNIFI_CLOUD_URL
              value: {{ .Values.unifi.cloudUrl | quote }}
            - name: UNIFI_LOCAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-ai.secretName" . }}
                  key: local-api-key
            - name: UNIFI_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-ai.secretName" . }}
                  key: cloud-api-key
            {{- if or .Values.unifi.dashboardToken .Values.unifi.existingSecret }}
            - name: DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-ai.secretName" . }}
                  key: dashboard-token
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
