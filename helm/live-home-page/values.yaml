replicaCount: 1

# Optional: dashboard header + browser tab title
appTitle: "Used IT Tech @ Home"

# Externally-reachable hostname of this app (e.g. unifi.example.com), exposed
# to the container as the HOST env var. Required when sso.clientId is set AND
# the app sits behind something that doesn't reliably forward
# X-Forwarded-Host/Proto to the pod (e.g. Gateway API HTTPRoute) — without it,
# Auth.js's header-based host detection (trustHost, see auth.ts) can fall back
# to the pod's own bind address, producing bad redirect URLs like
# https://0.0.0.0:4000/api/auth/signin/... In that case this value is used to
# set AUTH_URL=https://<host>, which Auth.js reads directly and skips
# header-based detection entirely. Should match one of httpRoute.hostnames /
# ingress.hosts.
host: ""

image:
  repository: ghcr.io/shesselink81/live-home-page
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# UniFi connection settings
unifi:
  # Local controller IP or hostname (required)
  localIp: "192.168.1.1"
  # Override full local URL (optional; constructed from localIp when empty)
  localUrl: ""
  # Cloud API base URL (optional)
  cloudUrl: "https://api.ui.com"

  # API keys — stored in a Secret created by this chart.
  # Set existingSecret to use a pre-existing Secret instead (keys: local-api-key, cloud-api-key).
  localApiKey: ""
  cloudApiKey: ""
  existingSecret: ""

  # Optional bearer token for /api/* routes (leave empty to disable)
  dashboardToken: ""

# Optional: live Platforms Monitor tab (MCP servers + Docker Engine API).
# Each source is independent — leave a URL empty to show a "not reachable"
# state for that source. None of these servers' own credentials are stored
# here; githubToken is the only secret this chart holds, stored the same way
# as the UniFi API keys above.
#
# host is a shortcut: when a specific *Url below is empty, its URL is built
# from host (http://<host>:<port>/mcp — kubernetesUrl:8087, githubUrl:8082,
# homeassistantUrl:8086; dockerApiUrl:2375, tcp:// not http://). Set an
# individual *Url instead if a source lives somewhere other than host.
#
# githubUrl/githubToken are read by the monitor pod (the GitHub tab stays
# there); kubernetesUrl/homeassistantUrl/dockerApiUrl are read by the backend
# pod (see backend.* below), which owns their polling + history.
mcp:
  host: ""
  kubernetesUrl: ""
  githubUrl: ""
  githubToken: ""
  homeassistantUrl: ""
  dockerApiUrl: ""

# Optional: Cloudflare section of the Platforms Monitor tab. Talks directly
# to the Cloudflare REST + GraphQL Analytics APIs — no MCP server, no
# host/URL needed (unlike mcp.* above): the backend pod auto-discovers every
# zone the token can see. Create a token at
# https://dash.cloudflare.com/profile/api-tokens with Zone -> Analytics ->
# Read (and Zone -> Zone -> Read) for the zones you want reported. Read by
# the backend pod (see backend.* below) and stored in the same Secret as the
# UniFi API keys above.
cloudflare:
  apiToken: ""

# Backend service (see backend/) — owns ISP/Kubernetes/Home Assistant/Docker
# polling and history, storing it in MariaDB (see db.* below) instead of
# losing it on every pod restart. Deployed as its own pod; the monitor pod
# reaches it over its ClusterIP Service (no Ingress/HTTPRoute — never
# reachable from outside the cluster).
backend:
  image:
    repository: ghcr.io/shesselink81/live-home-page-backend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  service:
    port: 4100
  resources: {}

# Optional: Prometheus exporter for UniFi metrics (WAN/ISP, devices, clients),
# served by the backend pod on :4100/metrics. Everything is off by default.
# The backend polls the controller on its own timer (pollInterval) and
# scrapes only read that cached snapshot, so the Prometheus scrape interval
# never changes how often UniFi gets hit. See README "Prometheus & Grafana".
metrics:
  enabled: false
  # Seconds between UniFi device/client polls for the exporter (min 5).
  # WAN/ISP metrics reuse the existing 10s ISP poll.
  pollInterval: 30
  # Per-client series (signal, traffic, uptime, info). One series set per
  # connected client — fine for a home network; turn off for large sites.
  perClient: true
  # Adds prometheus.io/scrape|port|path annotations to the backend pod, for
  # Prometheus setups that discover targets via annotations (no Operator).
  podAnnotations: false

  # Prometheus Operator ServiceMonitor (requires the monitoring.coreos.com
  # CRDs, e.g. from kube-prometheus-stack — install fails clearly if missing).
  serviceMonitor:
    enabled: false
    # Defaults to the release namespace. The ServiceMonitor always targets the
    # backend Service in the release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels — e.g. `release: prometheus` if your Prometheus'
    # serviceMonitorSelector requires it (kube-prometheus-stack default when
    # serviceMonitorSelectorNilUsesHelmValues is true).
    labels: {}
    jobLabel: ""
    relabelings: []
    metricRelabelings: []

  # Grafana dashboard ConfigMap for the Grafana sidecar (kube-prometheus-stack
  # / grafana chart with sidecar.dashboards.enabled). The JSON lives in
  # dashboards/unifi-overview.json and can also be imported manually.
  grafanaDashboard:
    enabled: false
    # Defaults to the release namespace. Set to Grafana's namespace if the
    # sidecar only watches its own namespace (sidecar.dashboards.searchNamespace).
    namespace: ""
    labels:
      grafana_dashboard: "1"
    # e.g. grafana_folder: UniFi (with sidecar.dashboards.folderAnnotation set)
    annotations: {}

  # Prometheus Operator PrometheusRule with UniFi alerts (WAN down/latency/
  # packet loss/uptime, device down/CPU/memory/load/temperature/reboot,
  # exporter health). See README "Alert rules". Requires the
  # monitoring.coreos.com CRDs.
  prometheusRule:
    enabled: false
    # Defaults to the release namespace.
    namespace: ""
    # Labels on the PrometheusRule object — must match your Prometheus'
    # ruleSelector (kube-prometheus-stack default: release: <helm release>).
    labels: {}
    # Extra labels added to every alert (e.g. for Alertmanager routing).
    alertLabels: {}
    thresholds:
      wanLatencyMs: 100       # 5-min average, for 10m
      wanUptimeRatio: 0.99    # rolling 24h
      deviceCpuRatio: 0.9     # 5-min average, for 15m
      deviceMemRatio: 0.9     # for 15m
      deviceLoad1: 4          # 5-min average of load1, for 15m
      deviceTemperatureC: 80  # hottest sensor, for 10m
    # Alert names to leave out, e.g. [UnifiDeviceRebooted]
    disabled: []
    # Additional rules (standard Prometheus rule objects), rendered as their
    # own "unifi-extra" group.
    extraRules: []

# MariaDB storing the backend's metric/chart history. Bundled as a
# single-replica Deployment + PVC by default (mirrors docker-compose.yaml's
# `db` service — no clustering, so a full StatefulSet isn't needed for one
# replica). Set enabled: false to use an external MariaDB/MySQL server
# instead, pointing host/port at it.
db:
  enabled: true
  host: ""     # required when enabled: false; ignored (uses the in-cluster Service) when true
  port: 3306
  user: unifi
  # Stored in the same Secret as the UniFi API keys above (or in
  # unifi.existingSecret, key `db-password`, if that's set instead).
  password: ""
  name: unifi_metrics
  image:
    repository: mariadb
    tag: "12"
  storage:
    size: 2Gi
    storageClassName: ""
  resources: {}

# Optional: restrict the whole app (pages + /api/*) to specific CIDRs, see
# app/src/middleware.ts. Leave empty to disable this check entirely (rely on
# sso/dashboardToken/an ingress-level allowlist instead).
network:
  allowedNetworks: ""

# Optional: Microsoft Entra ID SSO (see app/src/auth.ts). Layers on top of
# network.allowedNetworks above — both must pass, SSO doesn't replace it.
# Leave clientId/clientSecret/issuer empty to keep SSO fully disabled.
# clientSecret and authSecret are stored in the Secret this chart creates,
# the same way as the UniFi API keys above.
sso:
  clientId: ""
  clientSecret: ""
  # https://login.microsoftonline.com/<tenant-id>/v2.0
  issuer: ""
  # Random signing key for the session JWT — generate with:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  authSecret: ""
  # Optional comma-separated allowlist. Leave empty to allow any account in
  # the tenant (the tenant itself is still the boundary via the app registration).
  allowedEmails: ""

# Optional: Home tab favorite-app links. No built-in default — the Home tab
# shows no links until at least one entry is added. Entries sharing the same
# title are grouped together in the UI.
homeLinks:
  links: []
  # - title: "@home hosted web apps"
  #   label: "Home Assistant"
  #   url: "https://home.hessel.cloud/"
  #   note: "haos"  # optional
  # JSON {label,url} for the repo link tile
  repoLink: ""

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: live-home-page.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional: attach Traefik Middleware CRDs (traefik.io/v1alpha1) to the
# exposed route — e.g. an auth/rate-limit/redirect middleware you've defined
# separately (this chart doesn't create Middleware resources, only refs
# them). Applies to whichever of ingress/httpRoute is enabled above.
#
# - With ingress.enabled: rendered as the
#   traefik.ingress.kubernetes.io/router.middlewares annotation
#   (<namespace>-<name>@kubernetescrd), so `namespace` can point at a
#   middleware in any namespace.
# - With httpRoute.enabled: rendered as an ExtensionRef filter referencing
#   the traefik.io/v1alpha1 Middleware kind. Traefik's Gateway API provider
#   only resolves these within the HTTPRoute's own namespace (no
#   cross-namespace refs without a ReferenceGrant), so `namespace` here is
#   ignored — the Middleware must live in this release's namespace.
# - No effect unless the cluster's Traefik is actually the ingress
#   controller / Gateway API provider in front of this app.
traefik:
  middlewares: []
  # - name: my-middleware
  #   namespace: traefik   # optional, only used by the Ingress annotation form

# Gateway API HTTPRoute (gateway.networking.k8s.io/v1)
httpRoute:
  enabled: false
  parentRefs:
    - name: ""          # name of the Gateway resource (required)
      namespace: ""     # namespace of the Gateway (optional, defaults to same namespace)
      sectionName: ""   # listener name on the Gateway e.g. "https" (optional)
  hostnames: []
  # - unifi.example.com

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
