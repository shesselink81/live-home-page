{{- if .Values.db.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "live-home-page.dbFullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  # Internal-only — no Ingress/HTTPRoute for this Service. Only the backend
  # pod (via DB_HOST) ever talks to it.
  type: ClusterIP
  ports:
    - port: {{ .Values.db.port }}
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "live-home-page.dbSelectorLabels" . | nindent 4 }}
{{- end }}
