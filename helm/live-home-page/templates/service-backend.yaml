apiVersion: v1
kind: Service
metadata:
  name: {{ include "live-home-page.backendFullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Internal-only, on purpose — no Ingress/HTTPRoute for this Service. Only
  # the monitor pod (via BACKEND_URL) ever talks to it.
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "live-home-page.backendSelectorLabels" . | nindent 4 }}
