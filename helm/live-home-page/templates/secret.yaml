{{- if not .Values.unifi.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "live-home-page.fullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
type: Opaque
stringData:
  local-api-key: {{ .Values.unifi.localApiKey | quote }}
  cloud-api-key: {{ .Values.unifi.cloudApiKey | quote }}
  {{- if .Values.unifi.dashboardToken }}
  dashboard-token: {{ .Values.unifi.dashboardToken | quote }}
  {{- end }}
  {{- if .Values.mcp.githubToken }}
  mcp-github-token: {{ .Values.mcp.githubToken | quote }}
  {{- end }}
  {{- if .Values.sso.clientSecret }}
  sso-client-secret: {{ .Values.sso.clientSecret | quote }}
  {{- end }}
  {{- if .Values.sso.authSecret }}
  sso-auth-secret: {{ .Values.sso.authSecret | quote }}
  {{- end }}
{{- end }}
