{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "live-home-page.dbFullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  # Single RWO PVC — never run two pods against it at once during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "live-home-page.dbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "live-home-page.dbSelectorLabels" . | nindent 8 }}
    spec:
      # No podSecurityContext override here (unlike the app pods) — the
      # official MariaDB image's entrypoint needs to start as root to fix
      # /var/lib/mysql ownership before dropping to its own `mysql` user;
      # forcing a different runAsUser/fsGroup can break that.
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.db.name | quote }}
            - name: MARIADB_USER
              value: {{ .Values.db.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "live-home-page.secretName" . }}
                  key: db-password
            # No root password is ever set/stored — the backend connects as
            # MARIADB_USER, never root, so root access isn't needed.
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "live-home-page.dbFullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
