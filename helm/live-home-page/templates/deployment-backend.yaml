apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "live-home-page.backendFullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "live-home-page.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "live-home-page.backendSelectorLabels" . | nindent 8 }}
      {{- if and .Values.metrics.enabled .Values.metrics.podAnnotations }}
      # For Prometheus setups without the Operator (annotation-based
      # kubernetes_sd scraping). Harmless when a ServiceMonitor is used too.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4100"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4100
              protocol: TCP
          env:
            - name: UNIFI_LOCAL_URL
              value: {{ include "live-home-page.localUrl" . | quote }}
            - name: UNIFI_CLOUD_URL
              value: {{ .Values.unifi.cloudUrl | quote }}
            - name: UNIFI_LOCAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "live-home-page.secretName" . }}
                  key: local-api-key
            - name: UNIFI_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "live-home-page.secretName" . }}
                  key: cloud-api-key
            {{- if or .Values.mcp.kubernetesUrl .Values.mcp.host }}
            - name: MCP_KUBERNETES_URL
              value: {{ (.Values.mcp.kubernetesUrl | default (printf "http://%s:8087/mcp" .Values.mcp.host)) | quote }}
            {{- end }}
            {{- if or .Values.mcp.homeassistantUrl .Values.mcp.host }}
            - name: MCP_HOMEASSISTANT_URL
              value: {{ (.Values.mcp.homeassistantUrl | default (printf "http://%s:8086/mcp" .Values.mcp.host)) | quote }}
            {{- end }}
            {{- if or .Values.mcp.dockerApiUrl .Values.mcp.host }}
            - name: DOCKER_API_URL
              value: {{ (.Values.mcp.dockerApiUrl | default (printf "tcp://%s:2375" .Values.mcp.host)) | quote }}
            {{- end }}
            {{- if or .Values.cloudflare.apiToken .Values.unifi.existingSecret }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "live-home-page.secretName" . }}
                  key: cloudflare-api-token
                  optional: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_POLL_INTERVAL
              value: {{ .Values.metrics.pollInterval | quote }}
            - name: METRICS_PER_CLIENT
              value: {{ .Values.metrics.perClient | quote }}
            {{- end }}
            - name: DB_HOST
              value: {{ include "live-home-page.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "live-home-page.secretName" . }}
                  key: db-password
                  optional: true
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
