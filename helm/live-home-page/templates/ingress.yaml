{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "live-home-page.fullname" . }}
  labels:
    {{- include "live-home-page.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.traefik.middlewares }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.traefik.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "live-home-page.traefikMiddlewaresAnnotation" . }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "live-home-page.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
